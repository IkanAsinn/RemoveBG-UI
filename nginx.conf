# Remove Background: static hosting for the production build (dist/).
#
# Cross-origin isolation (COOP + COEP) is required for threaded WASM inference and must be on EVERY response,
# including 304 Not Modified: WebKit refuses a revalidated worker script without COEP (found in T-028).
# `always` makes nginx add the headers to every status code. Headers are repeated in each location because nginx
# does not inherit add_header into a location that declares its own.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # MIME types come from the image's /etc/nginx/mime.types (html, js, css, wasm, webp…). Do NOT add a `types {}`
    # block here: it replaces that table instead of extending it, and every file is then served as octet-stream.
    # .onnx is not listed there and falls back to default_type (application/octet-stream), which is what we want.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm application/octet-stream;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed build assets (JS, CSS, WASM): safe to cache forever.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Models and templates are not content-hashed: cache, but revalidate (ETag) so a new model ships with a deploy.
    location ~ ^/(models|templates)/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    # The ZIP streaming service worker must always be fresh.
    location = /zip-sw.js {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App shell: always revalidate so a deploy is picked up on the next load.
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
