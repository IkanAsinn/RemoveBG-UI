name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-removebg-ui
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ikanasinn/removebg-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests load the real tiny model; models are not committed (see .gitignore).
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('src/model/manifest.json') }}

      - name: Fetch models
        run: npm run models:fetch

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          missing=0
          for name in DOKPLOY_URL DOKPLOY_APPLICATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              missing=1
            fi
          done
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::Repository secret DOKPLOY_API_KEY is not set."
            missing=1
          fi
          exit $missing

      - name: Pin image to this commit
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA:0:7}"
          jq -n \
            --arg id "$DOKPLOY_APPLICATION_ID" \
            --arg image "$IMAGE" \
            --arg user "$GHCR_USER" \
            --arg token "$GHCR_TOKEN" \
            '{applicationId: $id, dockerImage: $image,
              username: (if $user == "" then null else $user end),
              password: (if $token == "" then null else $token end),
              registryUrl: null}' \
          | curl --fail --silent --show-error \
              --request POST \
              --header "accept: application/json" \
              --header "Content-Type: application/json" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --data @- \
              "$DOKPLOY_URL/api/application.saveDockerProvider"

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.deploy"
